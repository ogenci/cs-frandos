kind = "web"
previewPath = "/"
title = "CS Frandos Limited"
version = "1.0.0"
id = "artifacts/cs-frandos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21677

[services.development]
run = "pnpm --filter @workspace/cs-frandos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cs-frandos", "run", "build" ]
serve = "static"
publicDir = "artifacts/cs-frandos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21677"
BASE_PATH = "/"
